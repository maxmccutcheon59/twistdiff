[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "twistdiff"
version = "0.2.0"
description = "Lightweight ODE integration, LTI state-space, and PID control demos (CPU-only, educational)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Max McCutcheon", email = "MaxMcCutcheon1@outlook.com" }]
keywords = ["ode", "pid", "control", "state-space", "simulation", "numerical", "education"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=7.0", "ruff>=0.6", "matplotlib>=3.7"]

[project.urls]
Homepage = "https://github.com/maxmccutcheon59/twistdiff"
Repository = "https://github.com/maxmccutcheon59/twistdiff"
Issues = "https://github.com/maxmccutcheon59/twistdiff/issues"

[project.scripts]
twistdiff = "twistdiff.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["twistdiff*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
norecursedirs = [".git", ".venv", "*.egg-info"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
